<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Page</title>

    <!-- Improved styling for readability and responsiveness -->
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 40px auto;
            max-width: 800px;
            line-height: 1.6;
        }

        img {
            max-width: 100%;
            height: auto;
            margin-top: 20px;
            border-radius: 8px;
        }
    </style>
</head>

<body>
    <header>
        <h1>Welcome to My Website</h1>
    </header>

    <main>
        <p>This is an updated, clean, and responsive HTML example.</p>

        <!-- Flask static image reference preserved -->
        <img src="{{ url_for('static', filename='image/image.png') }}" 
             alt="Sample Image showing website content">
    </main>
</body>
</html>
